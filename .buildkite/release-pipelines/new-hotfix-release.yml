# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# This pipeline is meant to be triggered by release automation.

agents:
  queue: macos-large

steps:
  - label: "New Hotfix Release"
    command: |
      echo '--- Configure Git identity'
      .buildkite/commands/use-bot-for-git.sh

      source .buildkite/commands/select-xcode.sh
      .buildkite/commands/shared_setup.sh --skip-swiftpm

      echo '--- Access Secrets'
      bundle exec fastlane run configure_apply

      echo '--- New Hotfix Release'
      bundle exec fastlane new_hotfix_release version:"$RELEASE_VERSION" skip_confirm:true
    retry:
      manual:
        reason: If release jobs fail, re-trigger the release task rather than retrying this individual job.
        allowed: false
