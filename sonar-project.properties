# SonarQube Cloud analysis settings.
# Generated sources and Semgrep rule fixtures are covered by their own tooling.
sonar.exclusions=**/*.pb.swift,**/ThemeColor.swift,podcasts/Strings+Generated.swift,podcasts/ThemeStyle.swift,semgrep/tests/**

# Test fixtures intentionally use literal URLs and credential-like keys.
sonar.issue.ignore.multicriteria=testsHardcodedUris,testsHardcodedCredentials
sonar.issue.ignore.multicriteria.testsHardcodedUris.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.testsHardcodedUris.resourceKey=**/*Test*/**/*.swift
sonar.issue.ignore.multicriteria.testsHardcodedCredentials.ruleKey=swift:S2068
sonar.issue.ignore.multicriteria.testsHardcodedCredentials.resourceKey=**/*Test*/**/*.swift
