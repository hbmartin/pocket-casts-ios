                  regex: (?i)\[([\s\S]*?)(?=(\bkSecAttrAccessibleWhenUnlocked\b|\bkSecAttrAccessibleAlways\b|\bkSecAttrAccessibleAfterFirstUnlock\b))([\s\S]*?)\]

