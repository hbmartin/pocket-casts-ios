  # This rule intentionally favors known secret variable names, provider token
  # prefixes, and card-shaped values to keep noise low in a mature mobile app.
  # It will miss some high-entropy values stored under generic names.
  - id: hardcoded_secret
    severity: WARNING
    metadata:
      author: Maurizio Siddu
      references:
        - https://mas.owasp.org/MASTG/iOS/0x06d-Testing-Data-Storage/
        - https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password
        - https://cwe.mitre.org/data/definitions/798.html
        - https://cwe.mitre.org/data/definitions/547.html
      category: security
      confidence: LOW
      likelihood: MEDIUM
      impact: HIGH
      technology: [ios]
    message: >-
      This iOS mobile application seems containing some hardcoded information, this storage mode
      is insecure because does not guarantee the confidentiality of data.
      An attacker could be able to retrieve the hardcoded data from the code of iOS mobile
      application. 
      When saving reserved data into the device, it is recommended to adopt any of the encryption
      methods/tools internationally recognized as strong for iOS (adapt to the specific mobile
      application context).
    languages: [swift]
    patterns:
      # Hardcoded secret value
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  $SECRET = "=~/(?=.{16,})(?=.*[0-9])(?=.*[-_.:=+/])[A-Za-z0-9_.:=+/-]+/"
              - metavariable-regex:
                  metavariable: $SECRET
                  regex: (?i)(.*?)(?=(secret|password|pwd|psw|token|cookie|credential|bearer|private|api_?key|access_?key|secret_?key|client_?secret|encrypt|decrypt|pin|\biv\b))(.*?)
          - patterns:
              - pattern-inside: |
                  $SECRET = "=~/(?i)(sk_(live|test)_|pk_(live|test)_|ghp_|gho_|ghu_|ghs_|github_pat_|xox[baprs]-|AKIA|ASIA|AIza|ya29[.]|SG[.])[A-Za-z0-9_.:=+/-]{8,}/"
          - patterns:
              - pattern-inside: |
                  $SECRET = "=~/[0-9][0-9 -]{12,18}[0-9]/"
              - metavariable-regex:
                  metavariable: $SECRET
                  regex: (?i)(.*?)(?=(credit|card))(.*?)

