          - pattern-regex: "(?:=|\\bLIKE)\\s*'%?\\\\\\("
          - pattern-regex: "\"'\\\\\\(\\$?[A-Za-z0-9_.]*\\)'\""

  - id: pocketcasts.sql-inlist-interpolation
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [ios]
    message: Build SQL IN clauses with DBUtils.placeholders(amount:) and bound argument arrays instead of interpolating joined values into the statement.
    languages: [generic]
    paths:
      include:
        - "**/Modules/Sources/PocketCastsDataModel/**/*.swift"
        - "**/semgrep/tests/swift-security-sql-interpolation.swift"
    patterns:
      - pattern-regex: "(?i)\\bIN \\(\\\\\\((?!DBUtils\\.placeholders|placeholders\\))"

  - id: pocketcasts.no-fire-and-forget-datamanager-write
    severity: ERROR
    metadata:
      category: correctness
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [ios]
    message: Don't fire-and-forget DataManager writes via DispatchQueue.global().async — callers can't order follow-up reads after the write lands, and captured model objects race with main-thread mutation. Await the repository's saveAsync variant (or another awaitable write) instead.
    languages: [swift]
    paths:
      include:
        - "**/podcasts/**"
        - "**/Modules/**"
        - "**/semgrep/tests/swift-security-fire-and-forget-save.swift"
    patterns:
      - pattern-either:
          - pattern: |
              DispatchQueue.global().async {
                ...
                DataManager.sharedManager.$WRITE(...)
                ...
              }
          - pattern: |
              DispatchQueue.global(qos: $QOS).async {
                ...
                DataManager.sharedManager.$WRITE(...)
                ...
              }
      - metavariable-regex:
          metavariable: $WRITE
          regex: ^(save\w*|bulkSave\w*|bulkSet\w*|delete\w*)$

  - id: pocketcasts.no-real-network-hosts-in-tests
    severity: ERROR
    metadata:
      category: correctness
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [ios]
    message: Test download URLs must not point at real internet hosts — queued download tasks can hit the network for real, making tests flaky and environment-dependent. Use an RFC 2606 reserved name (example.com, *.test, *.invalid) for inert fixture URLs, or an RFC 5737 TEST-NET address (e.g. 192.0.2.1) when the connection should hang without real traffic.
    languages: [generic]
    paths:
      include:
        - "**/PocketCastsTests/**"
        - "**/Modules/Tests/**"
        - "**/semgrep/tests/swift-security-test-network-urls.swift"
    patterns:
      # Two ways to flag: (1) the authority section (everything before the first
      # /, ?, # or closing quote) contains '@' — userinfo always smuggles in a real
      # host (example.com@evil.com, localhost:pw@evil.com), and per-character anchors
      # can't tell a port from a password; (2) the host isn't on the reserved-host
      # allowlist. Each allowlist alternative is anchored with (?![a-zA-Z0-9.-]) so a
      # reserved host can't be used as a prefix of a real one (localhost.evil.com,
      # 127.evil.com, 192.0.2.1.evil.com).
      - pattern-regex: "(?i)downloadUrl\\s*=\\s*\"https?://(?:(?=[^/?#\"\\s]*@)|(?!([a-z0-9-]+\\.)*example\\.(com|org|net)(?![a-zA-Z0-9.-])|([a-z0-9-]+\\.)+(test|invalid)(?![a-zA-Z0-9.-])|localhost(?![a-zA-Z0-9.-])|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}(?![a-zA-Z0-9.-])|192\\.0\\.2\\.\\d{1,3}(?![a-zA-Z0-9.-])|198\\.51\\.100\\.\\d{1,3}(?![a-zA-Z0-9.-])|203\\.0\\.113\\.\\d{1,3}(?![a-zA-Z0-9.-])))"

  - id: pocketcasts.nonisolated-unsafe-requires-justification
    severity: ERROR
    metadata:
      category: correctness
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [ios]
    message: nonisolated(unsafe) opts out of compiler data-race checking. Prefer real isolation (@MainActor, an actor, a lock, or immutable state). If it is genuinely safe, explain why in a comment mentioning nonisolated(unsafe) on the same or an immediately preceding line, e.g. `// nonisolated(unsafe):` followed by the reason.
    languages: [swift]
    paths:
      include:
        - "**/*.swift"
    patterns:
      - pattern-regex: 'nonisolated\(unsafe\)'
      # Longest alternative first: a justifying comment block must extend its match through the
      # declaration below it, or the shorter comment-only alternative wins and fails to exempt it.
      # The two justifying alternatives (preceding-line and inline) require the keyword to be
      # followed — after an optional ':' and spaces — by a non-space char on the same line, i.e. an
      # actual reason. A bare `// nonisolated(unsafe)` repeats the keyword without justifying the
      # declaration, so it no longer exempts it. The final alternative stays loose so the token
      # appearing inside any comment is not itself flagged as an unjustified declaration.
      - pattern-not-regex: '(?://[^\n]*nonisolated\(unsafe\)[ \t]*:?[ \t]*\S[^\n]*\n(?:[^\n]*//[^\n]*\n)*[^\n]*nonisolated\(unsafe\))|(?:nonisolated\(unsafe\)[^\n]*//[^\n]*nonisolated\(unsafe\)[ \t]*:?[ \t]*\S)|(?://[^\n]*nonisolated\(unsafe\))'

  - id: pocketcasts.grdb-record-no-unchecked-sendable-class
    severity: ERROR
    metadata:
      category: concurrency
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [ios]
    message: >-
      @GRDBRecord types should be Sendable value-type structs (the GRDB 7 north star), not classes
      ratified with @unchecked Sendable. Folder, EpisodeFilter and Podcast are already structs; convert
      new records the same way (custom uuid Equatable/Hashable, mutating funcs, save() returns the saved
      value). Episode/UserEpisode stay classes only until Phase 5 (de-@objc BaseEpisode + playback
      position-tracking redesign) and are the sole allowed exceptions. See docs/Phase3-RecordSendability.md.
    languages: [swift]
    paths:
      include:
        - "**/Modules/Sources/PocketCastsDataModel/**/*.swift"
      exclude:
        - "**/Model/Episode.swift"
        - "**/Model/UserEpisode.swift"
    patterns:
      # A @GRDBRecord macro application whose declared type, within the next few lines, is a `class`
      # carrying `@unchecked Sendable`. re2 (no backreferences) — the bounded [\s\S] spans cover
      # comments and wrapped conformance lists between the macro, declaration, and Sendable marker.
      - pattern-regex: '@GRDBRecord\([^\n]*\)[\s\S]{0,600}?\bclass\b[\s\S]{0,300}?@unchecked\s+Sendable'
