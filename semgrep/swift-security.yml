  - id: nosql_inj
    severity: WARNING
    metadata:
      author: Maurizio Siddu
      references:
        - https://capec.mitre.org/data/definitions/676.html
        - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/05.6-Testing_for_NoSQL_Injection
      category: security
      confidence: MEDIUM
      likelihood: LOW
      impact: MEDIUM
      technology: [ios]
    message: >-
      This iOS mobile application could be vulnerable to NoSQL Injection, because the NoSQL queries
      are built dynamically as string by concatenating code and untrusted input.
      A successful NoSQL injection exploit, similar to that of a SQL injection, could allow an attacker
      to bypass authentication, read sensitive data from database, modify database data (Insert/Update/Delete),
      or even compromise the database and the underlying server. 
      It is recommended to avoid to build NoSQL queries with string concatenation of code and
      untrusted input, if this is needed at least a strong validation/sanitization of input
      should be performed. 
    languages: [swift]
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  $NOSQL = realm.objects($OBJ).filter($X + $Y)
              - metavariable-regex:
                  metavariable: $X
                  regex: ^("([\s\S]*)"|'([\s\S]*)')
              - metavariable-regex:
                  metavariable: $Y
                  regex: ^(?!")\w+
          - patterns:
              - pattern: |
                  $NOSQL = realm.objects($OBJ).filter($X + $Y + ...)
              - metavariable-regex:
                  metavariable: $X
                  regex: ^("([\s\S]*)"|'([\s\S]*)')
              - metavariable-regex:
                  metavariable: $Y
                  regex: ^(?!")\w+
          - patterns:
              - pattern: |
                  $NOSQL = realm.objects($OBJ).filter($X + ... + $Y)
              - metavariable-regex:
                  metavariable: $X
                  regex: ^("([\s\S]*)"|'([\s\S]*)')
              - metavariable-regex:
                  metavariable: $Y
                  regex: ^(?!")\w+
          - patterns:
              - pattern: |
                  $NOSQL = realm.objects($OBJ).filter($X + ... + $Y + ...)
              - metavariable-regex:
                  metavariable: $X
                  regex: ^("([\s\S]*)"|'([\s\S]*)')
              - metavariable-regex:
                  metavariable: $Y
                  regex: ^(?!")\w+    

  # Source: keychain/exportable_keychain.yaml
  - id: exportable_keychain
    severity: WARNING
    metadata:
      author: Maurizio Siddu
      references:
        - https://mas.owasp.org/MASTG/iOS/0x06d-Testing-Data-Storage/
        - https://developer.apple.com/documentation/security/keychain_services
        - https://support.apple.com/guide/security/keychain-data-protection-secb0694df1a/web
      category: security
      confidence: MEDIUM
      likelihood: LOW
      impact: LOW
      technology: [ios]
    message: >-
      This iOS mobile application seems configured with an exportable Keychain protection, when the
      accessibility level do not contain the "ThisDeviceOnly" suffix, then the Keychain data could be
      backed up to iCloud or via iTunes even if using unencrypted backups which can be restored to any
      device. Depending on how sensitive and private the stored data is, this may raise a privacy concern.
      When storing sensitive data it is recommended to use an high protection level for Keychain data having
      the "ThisDeviceOnly" suffix. Note that by default the kSecAttrAccessible flag for Keychain is set
      to "kSecAttrAccessibleWhenUnlocked".
      NOTE: this rule does not find the cases of kSecAttrAccessible not explicitly set, by default the 
      "kSecAttrAccessible" value is set to "kSecAttrAccessibleWhenUnlocked".
    languages: [swift]
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  $QUERY[kSecAttrAccessible as String] = $KEYCHAINPROTECTION
              - metavariable-regex:
                  metavariable: $KEYCHAINPROTECTION
                  regex: (?i)(\bkSecAttrAccessibleWhenUnlocked\b|\bkSecAttrAccessibleAlways\b|\bkSecAttrAccessibleAfterFirstUnlock\b)
          - patterns:
              - pattern-inside: |
                  $QUERY[kSecAttrAccessible] = $KEYCHAINPROTECTION
              - metavariable-regex:
                  metavariable: $KEYCHAINPROTECTION
                  regex: (?i)(\bkSecAttrAccessibleWhenUnlocked\b|\bkSecAttrAccessibleAlways\b|\bkSecAttrAccessibleAfterFirstUnlock\b)
          - patterns:
              - pattern-inside: |
                  $QUERY = $VALUE as CFDictionary
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)([\s\S]*?)(?=(\bkSecAttrAccessibleWhenUnlocked\b|\bkSecAttrAccessibleAlways\b|\bkSecAttrAccessibleAfterFirstUnlock\b))([\s\S]*?)
          - patterns:
              - pattern-inside: |
                  var $QUERY: [String: Any] = $VALUE
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)\[([\s\S]*?)(?=(\bkSecAttrAccessibleWhenUnlocked\b|\bkSecAttrAccessibleAlways\b|\bkSecAttrAccessibleAfterFirstUnlock\b))([\s\S]*?)\]
          - patterns:
              - pattern-inside: |
                  let $QUERY: [String: Any] = $VALUE
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)\[([\s\S]*?)(?=(\bkSecAttrAccessibleWhenUnlocked\b|\bkSecAttrAccessibleAlways\b|\bkSecAttrAccessibleAfterFirstUnlock\b))([\s\S]*?)\]
          - patterns:
              - pattern-inside: |
                  var $QUERY: [NSString: Any] = $VALUE
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)\[([\s\S]*?)(?=(\bkSecAttrAccessibleWhenUnlocked\b|\bkSecAttrAccessibleAlways\b|\bkSecAttrAccessibleAfterFirstUnlock\b))([\s\S]*?)\]
          - patterns:
              - pattern-inside: |
                  let $QUERY: [NSString: Any] = $VALUE
              - metavariable-regex:
