# Vendored from https://github.com/akabe1/akabe1-semgrep-rules/tree/main/ios/swift
# Source commit: db843f16c4a740c22d97c489d176ff663c1776b6
# Upstream README declares GNU GPL terms for these rules.
# Local copy avoids network access during Semgrep scans.
rules:
  - id: semgrep.absolute-path-include
    severity: WARNING
    metadata:
      category: security
      confidence: HIGH
      likelihood: LOW
      impact: MEDIUM
      technology: [semgrep]
    message: Semgrep paths.include entries are repo-relative; remove the leading slash so the rule can match.
    languages: [generic]
    paths:
      include:
        - "**/semgrep/*.yml"
        - "**/semgrep/*.yaml"
    patterns:
      - pattern-inside: |
          paths:
            include:
              ...
      - pattern-regex: '^\s*-\s*/[^#\n]+'

  - id: semgrep.regex-word-boundary-after-quote
    severity: WARNING
    metadata:
      category: correctness
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: LOW
      technology: [semgrep]
    message: Regex word boundaries after closing quotes usually cannot match; move the boundary inside the quoted token or remove it.
    languages: [generic]
    paths:
      include:
        - "**/semgrep/*.yml"
        - "**/semgrep/*.yaml"
    patterns:
      - pattern-regex: '^\s*-?\s*pattern-regex:\s*[''"][^#\n]*"(?!\\\\)\\b'

  - id: pocketcasts.no-sentry-or-automattic-tracks
    severity: ERROR
    metadata:
      category: dependency
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [ios]
    message: Sentry and Automattic Tracks have been replaced by Bitdrift; do not reintroduce these SDKs or CI upload paths.
    languages: [generic]
    paths:
      include:
        - "**/*.swift"
        - "**/Package.swift"
        - "**/Package.resolved"
        - "**/.github/workflows/*.yml"
        - "**/scripts/ci/*.sh"
    patterns:
      - pattern-regex: '\b(import\s+(Sentry|AutomatticTracks|AutomatticTracksEvents|AutomatticTracksModel|AutomatticRemoteLogging)|sentry-cocoa|Automattic-Tracks-iOS|SENTRY_AUTH_TOKEN|sentry-cli)\b'

  - id: pocketcasts.spm-no-branch-dependencies
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [swiftpm]
    message: Pin Swift Package Manager dependencies to immutable revisions or released versions instead of mutable branches.
    languages: [swift]
    paths:
      include:
        - "**/Package.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern: '.package(..., branch: $BRANCH, ...)'

  - id: pocketcasts.github-actions-pin-actions-to-sha
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [github-actions]
    message: Pin GitHub Actions to immutable commit SHAs instead of moving version tags.
    languages: [yaml]
    paths:
      include:
        - "**/.github/workflows/*.yml"
        - "**/semgrep/tests/github-actions-security.yml"
    patterns:
      - pattern: |
          uses: $ACTION
      - metavariable-regex:
          metavariable: $ACTION
          regex: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*@(?![0-9a-fA-F]{40}$).+$

  - id: pocketcasts.github-actions-no-workflow-level-write-permissions
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [github-actions]
    message: Keep workflow-level GitHub token permissions read-only; move write scopes to the specific job that needs them.
    languages: [yaml]
    paths:
      include:
        - "**/.github/workflows/*.yml"
        - "**/semgrep/tests/github-actions-security.yml"
    patterns:
      - pattern-either:
          - pattern: |
              permissions: write-all
          - pattern: |
              permissions:
                ...
                $SCOPE: write
                ...
      - pattern-not-inside: |
          jobs:
            ...

  - id: pocketcasts.github-actions-checkout-persist-credentials-false
    severity: ERROR
    metadata:
      category: security
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [github-actions]
    message: Set persist-credentials false on actions/checkout steps so GitHub credentials are not left in the repo config.
    languages: [yaml]
    paths:
      include:
        - "**/.github/workflows/*.yml"
        - "**/semgrep/tests/github-actions-security.yml"
    patterns:
      - pattern: |
          uses: $ACTION
      - metavariable-regex:
          metavariable: $ACTION
          regex: ^actions/checkout@
      - pattern-not-inside: |
          - ...
            uses: $ACTION
            with:
              ...
              persist-credentials: false
              ...

  - id: pocketcasts.github-actions-no-unconditional-service-credentials
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [github-actions]
    message: Gate service-credential secrets on trusted triggers (e.g. push or non-PR workflow_dispatch) instead of exposing them unconditionally to every run.
    languages: [yaml]
    paths:
      include:
        - "**/.github/workflows/*.yml"
        - "**/semgrep/tests/github-actions-security.yml"
    patterns:
      - pattern: |
          $ENVKEY: $SECRET
      - metavariable-regex:
          metavariable: $SECRET
          regex: ^\$\{\{\s*secrets\.[A-Za-z0-9_]*CREDENTIALS[A-Za-z0-9_]*\s*\}\}$

  - id: pocketcasts.release-fastlane-release-version-required
    severity: WARNING
    metadata:
      category: correctness
      confidence: HIGH
      likelihood: MEDIUM
      impact: LOW
      technology: [github-actions]
    message: release-fastlane hard-fails without release_version; keep the workflow_dispatch input required.
    languages: [yaml]
    paths:
      include:
        - "**/.github/workflows/release-fastlane.yml"
        - "**/semgrep/tests/github-actions-security.yml"
    patterns:
      - pattern-inside: |
          workflow_dispatch:
            inputs:
              ...
      - pattern: |
          release_version:
            ...
            required: false
            ...

  - id: pocketcasts.release-fastlane-beta-release-optional
    severity: WARNING
    metadata:
      category: correctness
      confidence: HIGH
      likelihood: MEDIUM
      impact: LOW
      technology: [github-actions]
    message: beta_release is only used by release_build; keep it optional in the manual workflow UI.
    languages: [yaml]
    paths:
      include:
        - "**/.github/workflows/release-fastlane.yml"
        - "**/semgrep/tests/github-actions-security.yml"
    patterns:
      - pattern-inside: |
          workflow_dispatch:
            inputs:
              ...
      - pattern: |
          beta_release:
            ...
            required: true
            ...

  - id: pocketcasts.no-insecure-cryptokit-hashes
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [ios]
    message: Do not use CryptoKit Insecure.MD5 or Insecure.SHA1 without a line-level suppression documenting a legacy compatibility requirement; use SHA256/HMAC/SHA3 as appropriate.
    languages: [swift]
    paths:
      include:
        - "**/*.swift"
        - "**/semgrep/tests/swift-security-crypto.swift"
    patterns:
      - pattern-either:
          - pattern: CryptoKit.Insecure.MD5.hash(...)
          - pattern: CryptoKit.Insecure.SHA1.hash(...)
          - pattern: Insecure.MD5.hash(...)
          - pattern: Insecure.SHA1.hash(...)

  - id: pocketcasts.bitdrift-gate-on-github-actions
    severity: WARNING
    metadata:
      category: correctness
      confidence: HIGH
      likelihood: MEDIUM
      impact: LOW
      technology: [shell]
    message: Bitdrift API-key enforcement should be gated on GITHUB_ACTIONS, not the generic CI variable.
    languages: [generic]
    paths:
      include:
        - "**/scripts/build-phases/upload-bitdrift-debug-files.sh"
        - "**/semgrep/tests/github-actions-security.yml"
    patterns:
      - pattern-regex: '\[\[\s+-n\s+"\$\{CI:-\}"\s*\]\]'

  - id: pocketcasts.ci-ios-simulator-runtime-normalize-empty
    severity: WARNING
    metadata:
      category: correctness
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [ci]
    message: Normalize IOS_SIMULATOR_RUNTIME_VERSION before using it; unset GitHub Actions repository variables arrive as empty strings.
    languages: [generic]
    paths:
      include:
        - "**/scripts/ci/*.sh"
        - "**/scripts/ci/*.rb"
        - "**/semgrep/tests/github-actions-security.yml"
    patterns:
      - pattern-regex: 'ENV\[[''"]IOS_SIMULATOR_RUNTIME_VERSION[''"]\](?!\.to_s\.strip)'

  - id: pocketcasts.shell-bsd-sed-in-place
    severity: WARNING
    metadata:
      category: correctness
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [shell]
    message: Avoid BSD-only `sed -i ''` in shell scripts; write to a temporary file or use a portable backup suffix so Linux runners do not fail.
    languages: [generic]
    paths:
      include:
        - "**/scripts/*.sh"
        - "**/scripts/**/*.sh"
        - "**/semgrep/tests/*.sh"
    patterns:
      # Catches `sed -i ''`, the attached form `sed -i''`, bundled short flags
      # (e.g. `sed -ni ''`), and `-i ''` after other flags (e.g. `sed -e ... -i ''`).
      # `[^|;&\n]*` keeps the match within one command, stopping at pipes and
      # `;`/`&&` separators so a later command's `-i ''` is not attributed to sed.
      - pattern-regex: "\\bsed\\s(?:[^|;&\\n]*\\s)?-\\w*i\\s*['\\\"]{2}"

  - id: pocketcasts.swiftui-connectable-timer-publisher-must-be-state
    severity: WARNING
    metadata:
      category: correctness
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [ios]
    message: Store manually connected Timer.publish publishers in SwiftUI state so @State subscriptions cannot outlive a recreated publisher.
    languages: [swift]
    paths:
      include:
        - "**/podcasts/Onboarding/Intro Carousel/StoriesView.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern-inside: |
          struct $VIEW: View {
            ...
          }
      - pattern: private let $TIMER = Timer.publish(...)

  - id: pocketcasts.no-datamanager-query-while-holding-nslock
    severity: ERROR
    metadata:
      category: correctness
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [ios]
    message: Do not call DataManager.sharedManager while an NSLock is held; release the lock before database queries to avoid lock inversion deadlocks.
    languages: [swift]
    paths:
      include:
        - "**/*.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern-either:
          - pattern: |
              $LOCK.lock()
              defer { $LOCK.unlock() }
              ...
              DataManager.sharedManager.$METHOD(...)
          - pattern: |
              $LOCK.withLock {
                ...
                DataManager.sharedManager.$METHOD(...)
                ...
              }

  - id: pocketcasts.no-unsafe-transfer-episode
    severity: ERROR
    metadata:
      category: correctness
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [ios]
    message: Do not use UnsafeTransfer for episode managed objects; snapshot primitive values and paths before crossing queues.
    languages: [swift]
    paths:
      include:
        - "**/*.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern-either:
          - patterns:
              - pattern: UnsafeTransfer($VALUE)
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i).*episode.*
          - patterns:
              - pattern-inside: |
                  func $FUNC(..., $VALUE: BaseEpisode, ...) {
                    ...
                  }
              - pattern: UnsafeTransfer($VALUE)

  - id: pocketcasts.cadisplaylink-no-self-target
    severity: ERROR
    metadata:
      category: performance
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [ios]
    message: CADisplayLink retains its target; use a weak target proxy instead of targeting self.
    languages: [swift]
    paths:
      include:
        - "**/*.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern: 'CADisplayLink(target: self, selector: $SELECTOR)'

  - id: pocketcasts.keychain-generic-password-requires-account
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [ios]
    message: Generic password Keychain items must include both kSecAttrService and kSecAttrAccount so items are scoped and testable.
    languages: [generic]
    paths:
      include:
        - "**/*.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern-either:
          - pattern-regex: '(?s)\[[^\]]*kSecClass\s+as\s+String\s*:\s*kSecClassGenericPassword[^\]]*kSecAttrService\s+as\s+String\s*:[^\]]*\]'
          - pattern-regex: '(?s)\[[^\]]*kSecAttrService\s+as\s+String\s*:[^\]]*kSecClass\s+as\s+String\s*:\s*kSecClassGenericPassword[^\]]*\]'
      - pattern-not-regex: '(?s)\[[^\]]*kSecAttrAccount\s+as\s+String\s*:[^\]]*\]'

  - id: pocketcasts.servercredentials-use-configure-sharing
    severity: ERROR
    metadata:
      category: correctness
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [ios]
    message: Configure ServerCredentials.sharing through ServerCredentials.configureSharing so startup write-once semantics are enforced.
    languages: [swift]
    paths:
      include:
        - "**/*.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern: ServerCredentials.sharing = $VALUE

  - id: pocketcasts.no-notificationdelegate-mainactor-assumeisolated
    severity: ERROR
    metadata:
      category: correctness
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [ios]
    message: UNUserNotificationCenterDelegate callbacks are not guaranteed to run on the main actor; dispatch explicitly with Task { @MainActor in ... }.
    languages: [swift]
    paths:
      include:
        - "**/*.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern-inside: |
          class $CLASS: $BASE, UNUserNotificationCenterDelegate {
            ...
          }
      - pattern: |
          MainActor.assumeIsolated {
            ...
          }

  - id: pocketcasts.timer-assumeisolated-requires-main-runloop
    severity: ERROR
    metadata:
      category: correctness
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [ios]
    message: Timer callbacks that use MainActor.assumeIsolated must be added to RunLoop.main, not RunLoop.current.
    languages: [swift]
    paths:
      include:
        - "**/*.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern-regex: 'RunLoop\.current\.add\([^,\n]+,\s*forMode:'

  - id: pocketcasts.podcast-search-wait-timeout-result-required
    severity: ERROR
    metadata:
      category: correctness
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [ios]
    message: PodcastSearchOperation must inspect DispatchGroup.wait(timeout:) before reading cross-callback state.
    languages: [swift]
    paths:
      include:
        - "**/Modules/Sources/PocketCastsServer/Public/Refresh/PodcastSearchOperation.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern-either:
          - pattern-inside: |
              class $CLASS {
                ...
              }
          - pattern-inside: |
              class $CLASS: $BASE {
                ...
              }
          - pattern-inside: |
              class $CLASS: $BASE, @unchecked Sendable {
                ...
              }
      - metavariable-regex:
          metavariable: $CLASS
          regex: ^(?:PodcastSearchOperation|UnsafePodcastSearchWait)$
      - pattern: |
          _ = $GROUP.wait(timeout: ...)

  - id: pocketcasts.no-podcast-retry-thread-sleep
    severity: ERROR
    metadata:
      category: performance
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [ios]
    message: Podcast retry backoff should schedule asynchronously instead of blocking a queue thread with Thread.sleep.
    languages: [swift]
    paths:
      include:
        - "**/*.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern: |
          Thread.sleep(forTimeInterval: $TRY.pollWaitingTime)

  - id: pocketcasts.future-promise-failure-must-return-before-success
    severity: ERROR
    metadata:
      category: correctness
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [ios]
    message: Return immediately after completing a Future promise with failure so execution cannot fall through to success.
    languages: [swift]
    paths:
      include:
        - "**/*.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern-regex: '(?s)\b\w+\.value\(\.failure\([^\n]*\)\)(?!\s*return).*?\b\w+\.value\(\.success\('

  - id: pocketcasts.core-animation-add-requires-reduce-motion-guard
    severity: WARNING
    metadata:
      category: accessibility
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [ios]
    message: Guard Core Animation additions in animated controls with UIAccessibility.isReduceMotionEnabled.
    languages: [swift]
    paths:
      include:
        - "**/podcasts/BasePlayPauseButton.swift"
        - "**/podcasts/SkipButton.swift"
        - "**/podcasts/SleepTimerButton.swift"
        - "**/podcasts/Common Components/Animated Controls/NowPlayingAnimationView.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern: |
          $LAYER.add($ANIMATION, forKey: $KEY)
      - pattern-not-inside: |
          if !UIAccessibility.isReduceMotionEnabled {
            ...
          }
      - pattern-not-inside: |
          guard !UIAccessibility.isReduceMotionEnabled else { ... }
          ...

  - id: pocketcasts.native-empty-state-action-weak-self
    severity: ERROR
    metadata:
      category: performance
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [ios]
    message: Native empty-state action closures are retained by contentUnavailableConfiguration; capture self weakly.
    languages: [swift]
    paths:
      include:
        - "**/podcasts/**/*.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern-inside: |
          ContentUnavailableConfiguration.nativeEmptyState(...)
      - pattern: |
          .init(...) {
            ...
            $EXPR
            ...
          }
      - metavariable-pattern:
          metavariable: $EXPR
          pattern: self.$MEMBER
      - pattern-not-regex: '(?s)\.init\s*\([^{}]*\)\s*\{\s*\[[^\]]*\bweak\s+self\b[^\]]*\]\s*(?:in\b|[^\{\}\n]*\bin\b)'

  - id: pocketcasts.public-protocol-no-mutable-combine-subject
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [ios]
    message: Public protocols should expose read-only AnyPublisher streams instead of mutable Combine subjects that consumers can send into.
    languages: [generic]
    paths:
      include:
        - "**/*.swift"
    patterns:
      - pattern-regex: 'public\s+protocol\s+\w+(?::[^{]+)?\s*\{[\s\S]{0,1000}\bvar\s+\w+\s*:\s*(?:PassthroughSubject|CurrentValueSubject)\s*<[^>\n]+>\s*\{\s*get\s*\}'

  - id: pocketcasts.download-episode-requested-no-strong-self
    severity: WARNING
    metadata:
      category: performance
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [ios]
    message: downloadEpisodeRequested can present asynchronously; capture self weakly or copy dependencies before passing its callback.
    languages: [generic]
    paths:
      include:
        - "**/podcasts/**/*.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern-regex: 'NetworkUtils\.shared\.downloadEpisodeRequested\s*\([^,\n]+,\s*\{(?!\s*\[[^\]]*\bweak\s+self\b)(?:(?!\},\s*disallowed:)[\s\S]){0,800}\bself\.'

  - id: pocketcasts.content-unavailable-assigned-inside-empty-branch
    severity: ERROR
    metadata:
      category: correctness
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [ios]
    message: Assign contentUnavailableConfiguration after the empty-state branch so it is cleared when content returns.
    languages: [swift]
    paths:
      include:
        - "**/podcasts/ListeningHistoryViewController.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern-inside: |
          private func refreshContentUnavailable() {
            ...
          }
      - pattern-inside: |
          if $ITEMS.isEmpty {
            ...
          }
      - pattern: self.contentUnavailableConfiguration = $CONFIG

  - id: pocketcasts.playlist-cell-bypass-datamanager-facade
    severity: WARNING
    metadata:
      category: correctness
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [ios]
    message: PlaylistCellViewModel playlist episode reads should go through DataManager.sharedManager or the injected DataManager facade.
    languages: [swift]
    paths:
      include:
        - "**/podcasts/PlaylistCellViewModel.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern-either:
          - pattern: episodesDataManager.playlistFirstDistinctEpisodes(...)
          - pattern: self.episodesDataManager.playlistFirstDistinctEpisodes(...)

  - id: pocketcasts.playlist-cell-task-group-image-manager-self-capture
    severity: WARNING
    metadata:
      category: performance
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [ios]
    message: Capture imageManager before entering the PlaylistCellViewModel task group instead of implicitly capturing self in child tasks.
    languages: [swift]
    paths:
      include:
        - "**/podcasts/PlaylistCellViewModel.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern: |
          $GROUP.addTask {
            ...
            $EXPR
            ...
          }
      - metavariable-pattern:
          metavariable: $EXPR
          pattern: self.imageManager

  - id: pocketcasts.playlist-cell-task-group-episode-object-capture
    severity: WARNING
    metadata:
      category: correctness
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [ios]
    message: Capture Episode uuid and podcastUuid before entering PlaylistCellViewModel task-group child tasks instead of reading the mutable Episode object concurrently.
    languages: [swift]
    paths:
      include:
        - "**/podcasts/PlaylistCellViewModel.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern: |
          $GROUP.addTask {
            ...
            $EXPR
            ...
          }
      - metavariable-pattern:
          metavariable: $EXPR
          patterns:
            - pattern: episode.$FIELD
            - metavariable-regex:
                metavariable: $FIELD
                regex: ^(?:podcastUuid|uuid)$

  - id: pocketcasts.share-button-localized-clip-export-failure
    severity: WARNING
    metadata:
      category: localization
      confidence: HIGH
      likelihood: MEDIUM
      impact: LOW
      technology: [ios]
    message: Localize the clip export failure toast with an L10n-backed string.
    languages: [swift]
    paths:
      include:
        - "**/podcasts/Sharing/ShareButton.swift"
        - "**/semgrep/tests/swift-security-pr-feedback.swift"
    patterns:
      - pattern-regex: 'Toast\.show\("Failed clip export:'

  - id: pocketcasts.native-empty-state-themecolor-bypass
    severity: WARNING
    metadata:
      category: theming
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [ios]
    message: Native empty-state themed colors should go through AppTheme.color(for:theme:).
    languages: [swift]
    paths:
      include:
        - "**/podcasts/Utilities/ContentUnavailableConfiguration.swift"
