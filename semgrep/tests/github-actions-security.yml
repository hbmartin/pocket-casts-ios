# ruleid: pocketcasts.github-actions-no-workflow-level-write-permissions
permissions:
  contents: write
jobs:
  build:
    steps:
      - run: echo unsafe
---
# ok: pocketcasts.github-actions-no-workflow-level-write-permissions
permissions:
  contents: read
jobs:
  danger:
    permissions:
      contents: read
      issues: write
      pull-requests: write
---
# ruleid: pocketcasts.github-actions-no-workflow-level-write-permissions
permissions: write-all
jobs:
  release:
    steps:
      - run: echo unsafe
---
# ok: pocketcasts.github-actions-no-workflow-level-write-permissions
permissions:
  contents: read
jobs:
  release:
    permissions: write-all
    steps:
      - run: echo scoped
