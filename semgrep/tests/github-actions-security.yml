---
steps:
  - name: Checkout repository
    # ruleid: pocketcasts.github-actions-checkout-persist-credentials-false
    uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
---
steps:
  - name: Checkout repository
    # ruleid: pocketcasts.github-actions-checkout-persist-credentials-false
    uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    with:
      fetch-depth: 0
---
steps:
  - name: Checkout repository
    # ruleid: pocketcasts.github-actions-checkout-persist-credentials-false
    uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    with:
      fetch-depth: 0
      persist-credentials: true
---
steps:
  - name: Checkout repository
    # ruleid: pocketcasts.github-actions-checkout-persist-credentials-false
    uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    with:
      submodules: recursive
---
steps:
  - name: Checkout repository
    # ok: pocketcasts.github-actions-checkout-persist-credentials-false
    uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    with:
      fetch-depth: 0
      persist-credentials: false
---
script: |
  if [[ -z "${BITDRIFT_API_KEY:-}" ]]; then
    # ruleid: pocketcasts.bitdrift-gate-on-github-actions
