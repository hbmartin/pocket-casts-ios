name: iOS CI

on:
  push:
    branches:
      - trunk
      - "release/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Fork PRs don't run CI automatically (they would execute untrusted code on
  # self-hosted runners). After reviewing the code, a maintainer applies the
  # `ci-approved` label to run CI once against the exact SHA that was current
  # when the label was added. New pushes do NOT re-run automatically — re-review
  # and re-apply the label. No repository secrets are exposed to these runs
  # (the credentials env below only populates for push/workflow_dispatch).
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Optional PR number to run manually after reviewing forked PR code."
        required: false
        type: string

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  contents: read

env:
  IOS_SIMULATOR_RUNTIME_VERSION: ${{ vars.IOS_SIMULATOR_RUNTIME_VERSION }}

jobs:
  build_and_test:
    name: Build and Test
    if: >-
      ${{
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_target' && github.event.label.name == 'ci-approved' && github.event.pull_request.head.repo.full_name != github.repository) ||
        (github.event_name != 'pull_request' && github.event_name != 'pull_request_target')
      }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    env:
      POCKET_CASTS_CI_DERIVED_DATA_PATH: ${{ github.workspace }}/../pocket-casts-ios-ci/DerivedData

    steps:
      - name: Checkout repository
        if: ${{ github.event_name != 'pull_request_target' && (github.event_name != 'workflow_dispatch' || inputs.pull_request_number == '') }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout manually approved PR head
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/pull/${{ inputs.pull_request_number }}/head

      # Pinned to the SHA that was current when `ci-approved` was applied, so a
      # push racing the label cannot swap in unreviewed code.
      - name: Checkout label-approved fork PR head
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build and test
        env:
          POCKET_CASTS_CREDENTIALS_JSON: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.pull_request_number == '')) && secrets.POCKET_CASTS_CREDENTIALS_JSON || '' }}
        run: scripts/ci/build-and-test.sh

      - name: Upload build logs and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-and-test-${{ github.run_id }}
          path: |
            build/github/logs/**/*.log
            build/github/results/PocketCastsTests.xcresult
          if-no-files-found: ignore
          retention-days: 14

  static_checks:
    name: Static Checks
    if: >-
      ${{
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_target' && github.event.label.name == 'ci-approved' && github.event.pull_request.head.repo.full_name != github.repository) ||
        (github.event_name != 'pull_request' && github.event_name != 'pull_request_target')
      }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        if: ${{ github.event_name != 'pull_request_target' && (github.event_name != 'workflow_dispatch' || inputs.pull_request_number == '') }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout manually approved PR head
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/pull/${{ inputs.pull_request_number }}/head

      # Pinned to the SHA that was current when `ci-approved` was applied, so a
      # push racing the label cannot swap in unreviewed code.
      - name: Checkout label-approved fork PR head
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run static checks
        env:
          POCKET_CASTS_CREDENTIALS_JSON: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.pull_request_number == '')) && secrets.POCKET_CASTS_CREDENTIALS_JSON || '' }}
        run: scripts/ci/static-checks.sh

      - name: Lint localized strings
        if: ${{ !cancelled() }}
        run: scripts/ci/localization-lint.sh

      - name: Upload static check logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-checks-${{ github.run_id }}
          path: build/github/logs/**/*.log
          if-no-files-found: ignore
          retention-days: 14
