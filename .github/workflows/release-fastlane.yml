name: Release Fastlane

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Fastlane release task to run."
        required: true
        type: choice
        options:
          - code_freeze
          - new_hotfix_release
          - new_beta_release
          - finalize_hotfix_release
          - finalize_release
          - publish_release
          - release_build
      release_version:
        description: "Release version, for example 8.9."
        required: true
        type: string
      beta_release:
        description: "Optional; only used when task is release_build."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-fastlane-${{ inputs.release_version || github.ref_name }}-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  release_task:
    name: Release Task
    if: ${{ inputs.task != 'release_build' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Fastlane release task
        env:
          GITHUB_TOKEN: ${{ secrets.POCKET_CASTS_RELEASE_GITHUB_TOKEN }}
          TASK: ${{ inputs.task }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          if [[ -z "${GITHUB_TOKEN:-}" ]]; then
            echo "POCKET_CASTS_RELEASE_GITHUB_TOKEN is required for release workflows."
            exit 1
          fi

          if [[ -z "${RELEASE_VERSION:-}" ]]; then
            echo "release_version is required for $TASK."
            exit 1
          fi

          scripts/ci/use-bot-for-git.sh
          source scripts/ci/select-xcode.sh

          case "$TASK" in
            new_beta_release|finalize_hotfix_release|finalize_release|publish_release)
              scripts/ci/checkout-release-branch.sh "$RELEASE_VERSION"
              ;;
          esac

          scripts/ci/shared-setup.sh --skip-swiftpm
          bundle exec fastlane run configure_apply

          case "$TASK" in
            code_freeze)
              bundle exec fastlane code_freeze version:"$RELEASE_VERSION" skip_confirm:true
              ;;
            new_hotfix_release)
              bundle exec fastlane new_hotfix_release version:"$RELEASE_VERSION" skip_confirm:true
              ;;
            new_beta_release)
              bundle exec fastlane new_beta_release skip_confirm:true
              ;;
            finalize_hotfix_release)
              bundle exec fastlane finalize_hotfix_release skip_confirm:true
              ;;
            finalize_release)
              bundle exec fastlane finalize_release skip_confirm:true
              ;;
            publish_release)
              bundle exec fastlane publish_release skip_confirm:true
              ;;
            *)
              echo "Unsupported release task: $TASK"
              exit 1
              ;;
          esac

  release_build:
    name: Release Build
    if: ${{ inputs.task == 'release_build' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build App Store artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.POCKET_CASTS_RELEASE_GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          if [[ -z "${GITHUB_TOKEN:-}" ]]; then
            echo "POCKET_CASTS_RELEASE_GITHUB_TOKEN is required for release workflows."
            exit 1
          fi

          if [[ -z "${RELEASE_VERSION:-}" ]]; then
            echo "release_version is required for release_build."
            exit 1
          fi

          scripts/ci/use-bot-for-git.sh
          source scripts/ci/select-xcode.sh
          scripts/ci/checkout-release-branch.sh "$RELEASE_VERSION"
          scripts/ci/shared-setup.sh
          bundle exec fastlane run configure_apply
          bundle exec fastlane build_app_store_connect

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-artifacts-${{ inputs.release_version }}
          path: |
            artifacts/*.ipa
            artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  release_upload:
    name: Release Upload
    if: ${{ inputs.task == 'release_build' }}
    needs: release_build
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-artifacts-${{ inputs.release_version }}
          path: downloaded-artifacts

      - name: Move release artifacts into Fastlane path
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find downloaded-artifacts -type f \( -name "*.ipa" -o -name "*.zip" \) -exec cp {} artifacts/ \;
          find artifacts -maxdepth 1 -type f

      - name: Upload and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.POCKET_CASTS_RELEASE_GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          BETA_RELEASE: ${{ inputs.beta_release }}
        run: |
          set -euo pipefail

          if [[ -z "${GITHUB_TOKEN:-}" ]]; then
            echo "POCKET_CASTS_RELEASE_GITHUB_TOKEN is required for release workflows."
            exit 1
          fi

          scripts/ci/use-bot-for-git.sh
          source scripts/ci/select-xcode.sh
          scripts/ci/checkout-release-branch.sh "$RELEASE_VERSION"
          scripts/ci/shared-setup.sh --skip-swiftpm
          bundle exec fastlane run configure_apply
          bundle exec fastlane upload_app_store_connect_build_to_testflight
          bundle exec fastlane create_release_on_github beta_release:"$BETA_RELEASE"
