name: Danger

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
      - edited

permissions:
  contents: read

jobs:
  danger:
    name: Danger
    if: ${{ github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Ruby tools
        run: scripts/ci/shared-setup.sh --skip-swiftpm

      - name: Build and test for Danger reports
        id: build_and_test
        continue-on-error: true
        env:
          POCKET_CASTS_CI_OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -debug-time-function-bodies"
        run: scripts/ci/build-and-test.sh

      - name: Log Ruby environment
        run: |
          set +e

          echo "Ruby command resolution"
          echo "PATH=$PATH"
          echo "ruby=$(command -v ruby || true)"
          ruby -v
          echo "bundle=$(command -v bundle || true)"
          bundle -v
          echo "mise=$(command -v mise || true)"
          mise current ruby
          mise which ruby

          echo "Bundler environment"
          env | sort | grep -E '^(BUNDLE|GEM|MISE|PATH|RBENV|RUBY|rvm_)=' || true
          bundle config list
          bundle info json --path

          echo "Ruby build configuration"
          ruby -rrbconfig -e 'puts "RbConfig.ruby=#{RbConfig.ruby}"; puts "ruby_version=#{RbConfig::CONFIG["ruby_version"]}"; puts "sitearch=#{RbConfig::CONFIG["sitearch"]}"; puts "libdir=#{RbConfig::CONFIG["libdir"]}"; puts "LIBRUBY=#{RbConfig::CONFIG["LIBRUBY"]}"; puts "LIBRUBYARG_SHARED=#{RbConfig::CONFIG["LIBRUBYARG_SHARED"]}"'

          echo "json native extension linkage"
          parser_bundle="$(find vendor/bundle/ruby -path '*/gems/json-*/lib/json/ext/parser.bundle' -print -quit 2>/dev/null || true)"
          if [[ -n "$parser_bundle" ]]; then
            echo "parser_bundle=$parser_bundle"
            file "$parser_bundle"
            otool -L "$parser_bundle"
          else
            echo "parser_bundle not found"
          fi

          exit 0

      - name: Run Danger
        env:
          DANGER_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source scripts/ci/ensure-mise.sh
          eval "$(mise env -s bash --cd "$PWD")"

          bundle exec danger

      - name: Propagate build and test failure
        if: ${{ steps.build_and_test.outcome == 'failure' }}
        run: exit 1
