name: Semgrep Swift Security

on:
  pull_request:
    paths:
      - "**/*.swift"
      - ".github/workflows/*.yml"
      - ".github/workflows/semgrep.yml"
      - "mise.toml"
      - "scripts/ci/*.sh"
      - "scripts/ci/*.rb"
      - "scripts/build-phases/*.sh"
      - "semgrep/pocket-casts.yml"
      - "semgrep/swift-security.yml"
  push:
    branches: [trunk]
    paths:
      - "**/*.swift"
      - ".github/workflows/*.yml"
      - ".github/workflows/semgrep.yml"
      - "mise.toml"
      - "scripts/ci/*.sh"
      - "scripts/ci/*.rb"
      - "scripts/build-phases/*.sh"
      - "semgrep/pocket-casts.yml"
      - "semgrep/swift-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:207983631beecdbe7fa29196c7f4a7a5f29033933cdb76c687ce4a672e07618d
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Run Swift Semgrep rules
        run: |
          semgrep scan --config semgrep/swift-security.yml --config semgrep/pocket-casts.yml --include "*.swift" --include "**/.github/workflows/*.yml" --include "**/scripts/ci/*.sh" --include "**/scripts/build-phases/*.sh" --include "**/semgrep/*.yml" --include "**/semgrep/*.yaml" --include "mise.toml" --include "**/mise.toml" --exclude "semgrep/tests/**" --metrics off --timeout 0 --disable-version-check --error --sarif-output semgrep-swift.sarif

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('semgrep-swift.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          sarif_file: semgrep-swift.sarif
